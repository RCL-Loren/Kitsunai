  <script type="module">
    import { renderMarkdown } from '../js/render/markdown.js';
    import { attachCodeCopy } from '../js/render/code-blocks.js';

    const src = document.getElementById('fixture').textContent.replace(/^\n/, '');
    const out = document.getElementById('out');
    let highlight = true;

    function draw() {
      const t0 = performance.now();
      out.innerHTML = renderMarkdown(src, { highlight });
      const ms = performance.now() - t0;
      document.getElementById('timing').textContent = `${src.length.toLocaleString()} chars · rendered in ${ms.toFixed(1)} ms`;
    }

    document.getElementById('theme').onclick = () => {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    };
    document.getElementById('hl').onclick = (e) => {
      highlight = !highlight;
      e.target.textContent = `Highlighting: ${highlight ? 'on' : 'off'}`;
      e.target.setAttribute('aria-pressed', String(highlight));
      draw();
    };
    attachCodeCopy(out);
    draw();
  </script>
