<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitsunAI</title>
  <script>
    // Set the theme before first paint to avoid a flash. main.js keeps it in sync.
    let theme = 'system';
    try { theme = localStorage.getItem('kitsunai-theme') || 'system'; } catch {}
    document.documentElement.dataset.theme = theme === 'system'
      ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : theme;
  </script>
  <meta name="theme-color" content="#0D0F1A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F7F2E8" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/markdown.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/motion.css">
  <script src="vendor/markdown-it/markdown-it.min.js" defer></script>
  <script src="vendor/highlight/highlight.min.js" defer></script>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <button type="button" class="menu-button icon-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <a class="brand display" href="#/"><img class="brand-mark" src="assets/icon.svg" width="24" height="24" alt=""> KitsunAI</a>
    </header>
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <main class="main" id="main"></main>
    <div class="drawer-backdrop" hidden></div>
  </div>
</body>
</html>
